<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A3 Draw your plot</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<style>
  .map { position: absolute; inset: 0; }
  .topfade { position: absolute; top: 0; left: 0; right: 0; height: 170px; background: linear-gradient(rgba(245,246,240,.96) 0%, rgba(245,246,240,.85) 60%, rgba(245,246,240,0) 100%); z-index: 5; }
  .top { position: relative; z-index: 20; padding: 2px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .step { font-size: 14px; font-weight: 700; color: var(--muted); }
  .hint { align-self: center; background: rgba(31,42,32,.88); color: #fff; font-size: 14.5px; font-weight: 600; padding: 10px 14px; border-radius: 12px; display: flex; gap: 8px; align-items: center; }
  .tools { position: absolute; right: 16px; top: 410px; z-index: 15; display: flex; flex-direction: column; gap: 10px; }
  .tool { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.96); box-shadow: 0 2px 8px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  .len { position: absolute; z-index: 12; background: #fff; color: var(--text); font-size: 12.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px; box-shadow: 0 1px 4px rgba(0,0,0,.2); transform: translate(-50%, -50%); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-radius: 26px 26px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.12); padding: 10px 22px 34px; display: flex; flex-direction: column; gap: 14px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #D3D7CE; align-self: center; }
  h1 { margin: 2px 0 0; font-size: 25px; font-weight: 800; line-height: 1.15; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 19px; font-weight: 800; }
  .stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .note { font-size: 14px; color: var(--muted); line-height: 1.4; margin: 0; }
  .btnrow { display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>

  <svg class="map" width="393" height="852" viewBox="0 0 393 852" aria-hidden="true">
    <defs>
      <pattern id="dry" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#CDB383"/><circle cx="2.5" cy="3" r="1.2" fill="#B89C69"/><circle cx="7" cy="6.5" r="1" fill="#DCC797"/><circle cx="6" cy="1.5" r=".7" fill="#A88F5F"/></pattern>
      <pattern id="olives" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#B39968"/><circle cx="17" cy="17" r="9" fill="#5E6B3C"/><circle cx="14" cy="14" r="4" fill="#6F7D48"/></pattern>
      <pattern id="crop" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><rect width="12" height="12" fill="#A3B26C"/><rect width="5" height="12" fill="#8C9B57"/></pattern>
    </defs>
    <rect width="393" height="852" fill="url(#dry)"/>
    <polygon points="0,0 393,0 393,150 0,175" fill="url(#olives)"/>
    <polygon points="310,150 393,150 393,852 290,852" fill="url(#crop)"/>
    <path d="M300 150 C 296 400, 286 600, 284 852" stroke="#E4D8BE" stroke-width="16" fill="none"/>
    <!-- brambles and weeds patches -->
    <g fill="#6E7A3E" opacity=".85"><ellipse cx="80" cy="250" rx="34" ry="16"/><ellipse cx="200" cy="470" rx="26" ry="14"/><ellipse cx="70" cy="440" rx="20" ry="12"/></g>
    <g fill="#4F5E32"><circle cx="120" cy="300" r="15"/><circle cx="104" cy="292" r="8"/><circle cx="210" cy="230" r="13"/><circle cx="90" cy="400" r="17"/></g>
    <!-- farmhouse -->
    <g transform="rotate(-4 170 580)"><rect x="128" y="550" width="90" height="62" fill="#E8E1D2"/><rect x="128" y="550" width="90" height="30" fill="#B85C3C"/><rect x="128" y="580" width="90" height="2" fill="#9C4A2E"/></g>
    <!-- well -->
    <circle cx="236" cy="380" r="9" fill="#7E8C93" stroke="#E8E1D2" stroke-width="3"/>
    <!-- drawn plot polygon -->
    <polygon points="34,196 268,178 262,498 30,516" fill="rgba(45,106,58,.22)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="34,196 268,178 262,498 30,516" fill="none" stroke="#2D6A3A" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#fff" stroke="#2D6A3A" stroke-width="3.5">
      <circle cx="34" cy="196" r="10"/><circle cx="268" cy="178" r="10"/><circle cx="262" cy="498" r="10"/><circle cx="30" cy="516" r="10"/>
    </g>
    <circle cx="30" cy="516" r="17" fill="none" stroke="#fff" stroke-width="2" opacity=".9"/>
  </svg>
  <div class="topfade"></div>

  <span class="len" style="left: 151px; top: 187px">62 m</span>
  <span class="len" style="left: 265px; top: 338px">104 m</span>
  <span class="len" style="left: 146px; top: 507px">62 m</span>
  <span class="len" style="left: 32px; top: 356px">105 m</span>

  <div class="status">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1F2A20"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#1F2A20"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#1F2A20"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1F2A20"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#1F2A20"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.6a4.2 4.2 0 0 0-6 0z" fill="#1F2A20"/><path d="M1.2 4.2a9.7 9.7 0 0 1 13.6 0l-1.4 1.6a7.6 7.6 0 0 0-10.8 0z" fill="#1F2A20"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#1F2A20" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#1F2A20"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1F2A20" opacity=".4"/></svg>
    </span>
  </div>

  <div class="top">
    <div class="row">
      <div class="circle-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span class="step">Set up your garden · Step 2 of 7</span>
        <div class="progress"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="hint">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 14.5a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg>
      Tap each corner. Drag a point to adjust it.
    </div>
  </div>

  <div class="tools">
    <div class="tool" aria-label="Undo last point"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></div>
    <div class="tool" aria-label="Start again"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></div>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <h1>Draw the edges of your land</h1>
    <div class="stats">
      <div class="stat"><b>6,480 m²</b><span>Area · 0.65 ha</span></div>
      <div class="stat"><b>333 m</b><span>Perimeter</span></div>
      <div class="stat"><b>4</b><span>Corners</span></div>
    </div>
    <p class="note">Satellite images can be a few metres off. You can fine-tune the shape later from the Garden tab.</p>
    <div class="btnrow">
      <div class="btn secondary" style="flex: none; width: 110px">Skip</div>
      <div class="btn primary" style="flex: 1">Next: zones</div>
    </div>
  </div>
  <div class="home"></div>
</div></div></div>
</body>
</html>
