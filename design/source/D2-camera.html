<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D2 Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<style>
  .screen { background: #000; }
  .photo { position: absolute; inset: 0; }
  .status, .status * { color: #fff; }
  .topbar { position: relative; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 0; }
  .glass { height: 44px; min-width: 44px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-size: 15px; font-weight: 700; }
  .tip { position: absolute; z-index: 20; top: 130px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 12px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  .frame { position: absolute; z-index: 15; left: 46px; top: 220px; width: 300px; height: 300px; }
  .frame i { position: absolute; width: 36px; height: 36px; border: 4px solid #fff; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.82) 30%); padding: 40px 22px 40px; display: flex; flex-direction: column; gap: 18px; }
  .thumbs { display: flex; align-items: center; gap: 10px; }
  .th { width: 56px; height: 56px; border-radius: 12px; border: 2px dashed rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .shutter { width: 78px; height: 78px; border-radius: 999px; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; }
  .shutter span { width: 62px; height: 62px; border-radius: 999px; background: #fff; }
  .home { background: #fff; }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>

  <svg class="photo" width="393" height="852" viewBox="0 0 393 852" aria-hidden="true">
    <defs>
      <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#6E7F4A"/><stop offset=".55" stop-color="#4A5A30"/><stop offset="1" stop-color="#26301A"/></radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8DBB5A"/><stop offset=".6" stop-color="#5E9238"/><stop offset="1" stop-color="#3F6E26"/></linearGradient>
      <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FAE4E"/><stop offset="1" stop-color="#3B6524"/></linearGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B4630"/><stop offset="1" stop-color="#3A2C1E"/></linearGradient>
    </defs>
    <rect width="393" height="852" fill="url(#bg)"/>
    <rect y="600" width="393" height="252" fill="url(#soil)"/>
    <g filter="url(#blur)" opacity=".7">
      <ellipse cx="60" cy="200" rx="70" ry="40" fill="#7D9450"/>
      <ellipse cx="340" cy="640" rx="80" ry="40" fill="#5E7A38"/>
      <ellipse cx="330" cy="160" rx="60" ry="30" fill="#9AAE6A"/>
    </g>
    <path d="M196 780 C 194 650, 200 520, 198 360" stroke="#6E8F3C" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M198 420 C 150 360, 90 330, 80 260 C 140 250, 190 300, 198 420z" fill="url(#leaf)"/>
    <path d="M198 420 C 160 360, 120 320, 84 268" stroke="#C7E09A" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M200 380 C 250 320, 300 290, 318 220 C 250 220, 205 280, 200 380z" fill="url(#leaf2)"/>
    <path d="M200 380 C 240 320, 280 270, 314 226" stroke="#C7E09A" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M199 520 C 140 500, 100 470, 76 420 C 140 410, 185 450, 199 520z" fill="url(#leaf2)"/>
    <path d="M199 500 C 260 490, 300 460, 324 410 C 260 400, 210 440, 199 500z" fill="url(#leaf)"/>
    <!-- aphid cluster -->
    <g fill="#2E3A1E"><ellipse cx="150" cy="330" rx="4" ry="2.6"/><ellipse cx="160" cy="336" rx="3.6" ry="2.3"/><ellipse cx="143" cy="340" rx="3.4" ry="2.2"/><ellipse cx="155" cy="346" rx="3.8" ry="2.4"/><ellipse cx="166" cy="326" rx="3" ry="2"/></g>
    <g fill="#C9C38A" opacity=".8"><circle cx="128" cy="310" r="3"/><circle cx="172" cy="352" r="2.5"/><circle cx="138" cy="322" r="2"/></g>
  </svg>

  <div class="status">
    <span style="color:#fff">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#fff"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.6a4.2 4.2 0 0 0-6 0z" fill="#fff"/><path d="M1.2 4.2a9.7 9.7 0 0 1 13.6 0l-1.4 1.6a7.6 7.6 0 0 0-10.8 0z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#fff" opacity=".5"/></svg>
    </span>
  </div>

  <div class="topbar">
    <div class="glass" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <div class="glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Diagnose</div>
    <div class="glass" aria-label="Flash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></div>
  </div>

  <div class="tip">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>
    Get close to the leaf, in daylight
  </div>

  <div class="frame">
    <i style="left:0; top:0; border-right:none; border-bottom:none; border-radius: 14px 0 0 0"></i>
    <i style="right:0; top:0; border-left:none; border-bottom:none; border-radius: 0 14px 0 0"></i>
    <i style="left:0; bottom:0; border-right:none; border-top:none; border-radius: 0 0 0 14px"></i>
    <i style="right:0; bottom:0; border-left:none; border-top:none; border-radius: 0 0 14px 0"></i>
  </div>

  <div class="bottom">
    <div class="thumbs">
      <div class="th" style="border: 2px solid #fff; overflow: hidden">
        <svg width="52" height="52" viewBox="0 0 52 52"><rect width="52" height="52" fill="#4A5A30"/><path d="M26 50 C 26 36, 26 26, 26 16" stroke="#6E8F3C" stroke-width="3"/><path d="M26 26 C 18 20, 10 18, 8 10 C 18 10, 24 16, 26 26z" fill="#7FAE4E"/><path d="M26 22 C 34 16, 42 14, 44 6 C 34 6, 28 12, 26 22z" fill="#5E9238"/></svg>
      </div>
      <div class="th"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="th"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <div style="margin-left: 6px; color: #fff; display: flex; flex-direction: column; gap: 2px">
        <b style="font-size: 15px">1 of 3 photos</b>
        <span style="font-size: 13px; opacity: .85">Add the underside and the whole plant</span>
      </div>
    </div>
    <div class="controls">
      <div class="glass" style="justify-self: start; width: 52px; height: 52px; padding: 0" aria-label="Choose from library"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/></svg></div>
      <div class="shutter" aria-label="Take photo"><span></span></div>
      <div style="justify-self: end; height: 52px; border-radius: 999px; background: #fff; color: #1F2A20; font-size: 16px; font-weight: 800; display: flex; align-items: center; padding: 0 18px">Done</div>
    </div>
  </div>
  <div class="home"></div>
</div></div></div>
</body>
</html>
