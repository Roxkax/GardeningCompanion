<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C1 Garden map</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<style>
  .map { position: absolute; inset: 0; }
  .topfade { position: absolute; top: 0; left: 0; right: 0; height: 200px; background: linear-gradient(rgba(245,246,240,.97) 0%, rgba(245,246,240,.9) 62%, rgba(245,246,240,0) 100%); z-index: 5; }
  .top { position: relative; z-index: 20; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .titlerow { display: flex; justify-content: space-between; align-items: flex-end; }
  .titlerow h1 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1; }
  .titlerow .sub { font-size: 15px; font-weight: 600; color: var(--muted); }
  .avatar { width: 44px; height: 44px; border-radius: 999px; background: var(--green); color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chips { display: flex; gap: 8px; }
  .chip { height: 36px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.96); box-shadow: 0 1px 5px rgba(0,0,0,.15); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .chip.on { background: var(--text); color: #fff; }
  .zlabel { position: absolute; z-index: 12; transform: translate(-50%, -50%); background: #fff; border-radius: 9px; padding: 4px 9px 4px 7px; font-size: 13px; font-weight: 800; display: flex; gap: 6px; align-items: center; box-shadow: 0 1px 5px rgba(0,0,0,.22); white-space: nowrap; }
  .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .poi { position: absolute; z-index: 12; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 999px; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .ctrls { position: absolute; right: 16px; top: 470px; z-index: 15; display: flex; flex-direction: column; gap: 10px; }
  .card { position: absolute; left: 16px; right: 16px; bottom: 104px; z-index: 30; background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.16); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .card .head { display: flex; align-items: center; gap: 10px; }
  .card .head b { font-size: 18px; font-weight: 800; }
  .card .head span.meta { font-size: 14px; color: var(--muted); font-weight: 600; }
  .pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green-ink); }
  .card .next { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .card .actions { display: flex; gap: 10px; }
  .card .actions .btn { height: 44px; font-size: 15px; flex: 1; }
  nav.tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); padding: 8px 8px 26px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; }
  nav.tabs a { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; min-height: 48px; justify-content: flex-end; }
  nav.tabs a.on { color: var(--green); font-weight: 700; }
  nav.tabs .cam { width: 58px; height: 58px; border-radius: 999px; background: var(--green); display: flex; align-items: center; justify-content: center; margin-top: -22px; border: 4px solid var(--bg); }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>

  <svg class="map" width="393" height="852" viewBox="0 0 393 852" aria-hidden="true">
    <defs>
      <pattern id="dry" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#CDB383"/><circle cx="2.5" cy="3" r="1.2" fill="#B89C69"/><circle cx="7" cy="6.5" r="1" fill="#DCC797"/></pattern>
      <pattern id="olives" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#B39968"/><circle cx="15" cy="15" r="8" fill="#5E6B3C"/></pattern>
      <pattern id="crop" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><rect width="12" height="12" fill="#A3B26C"/><rect width="5" height="12" fill="#8C9B57"/></pattern>
    </defs>
    <rect width="393" height="852" fill="url(#dry)"/>
    <polygon points="0,0 393,0 393,150 0,170" fill="url(#olives)"/>
    <polygon points="362,150 393,150 393,852 352,852" fill="url(#crop)"/>
    <path d="M356 150 C 354 350, 350 550, 348 852" stroke="#E4D8BE" stroke-width="12" fill="none"/>
    <polygon points="0,560 330,545 330,852 0,852" fill="url(#crop)" opacity=".9"/>
    <g fill="#6E7A3E" opacity=".85"><ellipse cx="110" cy="236" rx="34" ry="12"/><ellipse cx="260" cy="232" rx="40" ry="12"/></g>
    <g fill="#4F5E32"><circle cx="232" cy="340" r="12"/><circle cx="300" cy="330" r="12"/><circle cx="305" cy="410" r="13"/><circle cx="230" cy="420" r="11"/><circle cx="268" cy="375" r="10"/><circle cx="296" cy="470" r="11"/><circle cx="236" cy="480" r="10"/></g>
    <g transform="rotate(-3 110 520)"><rect x="70" y="500" width="76" height="46" fill="#E8E1D2"/><rect x="70" y="500" width="76" height="23" fill="#B85C3C"/></g>

    <!-- zones -->
    <polygon points="40,206 336,192 334,272 38,286" fill="rgba(47,111,176,.30)" stroke="#2F6FB0" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="38,286 200,278 197,494 34,500" fill="rgba(45,106,58,.30)" stroke="#2D6A3A" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="200,278 334,272 331,488 197,494" fill="rgba(122,79,30,.26)" stroke="#7A4F1E" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="40,206 336,192 331,488 34,500" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" opacity=".9"/>

    <!-- beds in zone A -->
    <g fill="#7A5A36" stroke="#fff" stroke-width="1.6">
      <rect x="56" y="316" width="22" height="104" rx="3"/>
      <rect x="88" y="316" width="22" height="104" rx="3"/>
      <rect x="120" y="316" width="22" height="104" rx="3"/>
      <rect x="152" y="316" width="22" height="104" rx="3"/>
    </g>
    <g fill="#3E8A47"><circle cx="99" cy="334" r="3"/><circle cx="99" cy="350" r="3"/><circle cx="99" cy="366" r="3"/><circle cx="99" cy="382" r="3"/><circle cx="99" cy="398" r="3"/></g>
  </svg>
  <div class="topfade"></div>

  <span class="zlabel" style="left: 186px; top: 240px"><i class="dot" style="background:#2F6FB0"></i>B · To clear</span>
  <span class="zlabel" style="left: 104px; top: 442px"><i class="dot" style="background:#2D6A3A"></i>A · Vegetables</span>
  <span class="zlabel" style="left: 266px; top: 446px"><i class="dot" style="background:#7A4F1E"></i>C · Olives</span>
  <span class="poi" style="left: 180px; top: 476px" aria-label="Well"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E4E7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span>
  <span class="poi" style="left: 36px; top: 360px" aria-label="Gate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M20 4v16M4 8h16M4 16h16M8 8l8 8"/></svg></span>

  <div class="status">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1F2A20"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#1F2A20"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#1F2A20"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1F2A20"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#1F2A20"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.6a4.2 4.2 0 0 0-6 0z" fill="#1F2A20"/><path d="M1.2 4.2a9.7 9.7 0 0 1 13.6 0l-1.4 1.6a7.6 7.6 0 0 0-10.8 0z" fill="#1F2A20"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#1F2A20" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#1F2A20"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1F2A20" opacity=".4"/></svg>
    </span>
  </div>

  <div class="top">
    <div class="titlerow">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="sub">Near Évora · 6,480 m²</span>
        <h1>Garden</h1>
      </div>
      <div style="display: flex; gap: 10px; align-items: center">
        <div class="circle-btn" aria-label="Edit map"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></div>
        <div class="avatar">D</div>
      </div>
    </div>
    <div class="chips">
      <span class="chip on">Zones</span>
      <span class="chip on">Beds</span>
      <span class="chip on">Points</span>
      <span class="chip">Irrigation</span>
    </div>
  </div>

  <div class="ctrls">
    <div class="circle-btn" aria-label="Centre on my location"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2D6A3A"><path d="M21 3L3 10.5l7.5 3 3 7.5z"/></svg></div>
  </div>

  <div class="card">
    <div class="head">
      <i class="dot" style="background:#2D6A3A; width: 14px; height: 14px"></i>
      <b>Zone A</b><span class="meta">Vegetables · 2,140 m² · 4 beds</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <span class="pill">Prepare soil</span>
      <span style="font-size: 13px; font-weight: 600; color: var(--muted)">Phase 3 of 8</span>
    </div>
    <div class="next">Next: spread compost on beds A1–A3 · before 15 Nov</div>
    <div class="actions">
      <div class="btn primary">Open zone</div>
      <div class="btn secondary">Assess</div>
    </div>
  </div>

  <nav class="tabs" aria-label="Main">
    <a><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>Today</a>
    <a class="on" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2.5 6 2.5 6-2.5v14l-6 2.5-6-2.5-6 2.5z"/><path d="M9 3.5v14M15 6v14"/></svg>Garden</a>
    <a aria-label="Snap and Ask" style="justify-content: center"><span class="cam"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></a>
    <a><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</a>
    <a><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>Journal</a>
  </nav>
  <div class="home"></div>
</div></div></div>
</body>
</html>
