<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G1 Me</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<style>
  .nav { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .nav b { font-size: 17px; font-weight: 700; }
  .close { width: 36px; height: 36px; border-radius: 999px; background: #E6E9E0; display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; overflow: hidden; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 16px; }
  .body > * { flex: none; }
  .profile { display: flex; align-items: center; gap: 14px; }
  .bigav { width: 64px; height: 64px; border-radius: 999px; background: var(--green); color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .profile b { display: block; font-size: 22px; font-weight: 800; }
  .profile span { font-size: 14.5px; color: var(--muted); font-weight: 600; }
  .usage { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .usage .top { display: flex; justify-content: space-between; align-items: baseline; }
  .usage .top b { font-size: 16px; }
  .usage .top span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: #EEF0EA; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 21%; background: var(--green); border-radius: 6px; }
  .usage p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px 4px; }
  .list { background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 54px; border-bottom: 1px solid #EEF0EA; }
  .item:last-child { border-bottom: none; }
  .ic { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex: none; }
  .item b { flex: 1; font-size: 16px; font-weight: 600; }
  .item em { font-style: normal; font-size: 14px; color: var(--muted); font-weight: 600; }
  .item em.warn { color: #7A3A08; background: var(--orange-soft); padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .item em.cnt { color: var(--green-ink); background: var(--green-soft); padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#1F2A20"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#1F2A20"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#1F2A20"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#1F2A20"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#1F2A20"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.6a4.2 4.2 0 0 0-6 0z" fill="#1F2A20"/><path d="M1.2 4.2a9.7 9.7 0 0 1 13.6 0l-1.4 1.6a7.6 7.6 0 0 0-10.8 0z" fill="#1F2A20"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#1F2A20" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#1F2A20"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#1F2A20" opacity=".4"/></svg>
    </span>
  </div>

  <div class="nav">
    <span style="width: 36px"></span>
    <b>Me</b>
    <span class="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
  </div>

  <div class="body">
    <div class="profile">
      <div class="bigav">D</div>
      <div><b>Diogo</b><span>Plot near Évora · 0.65 ha · 3 zones</span></div>
    </div>

    <div class="usage">
      <div class="top"><b>AI this month</b><span>42 of 200 requests</span></div>
      <div class="bar"><i></i></div>
      <p>Photo checks, the assistant and weekly reviews. Resets on 1 November.</p>
    </div>

    <div>
      <div class="label">Learn and plan</div>
      <div class="list">
        <div class="item">
          <span class="ic" style="background: var(--green-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2z"/></svg></span>
          <b>Guides</b><em>48 guides</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="item">
          <span class="ic" style="background: var(--green-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M17 7L5 19"/><path d="M4 20l2-2"/></svg></span>
          <b>Tools</b><em class="cnt">2 to get</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="item">
          <span class="ic" style="background: var(--blue-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E4E7A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z"/></svg></span>
          <b>Weather</b><em class="warn">Frost Thu</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="item">
          <span class="ic" style="background: var(--green-soft)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></span>
          <b>Garden memory</b><em class="cnt">24 facts</em>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <div>
      <div class="label">App</div>
      <div class="list">
        <div class="item">
          <span class="ic" style="background: #EEF0EA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          <b>Settings</b>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="item">
          <span class="ic" style="background: #EEF0EA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2.2-2.4 3.7"/><path d="M12 17h.01"/></svg></span>
          <b>Help and feedback</b>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="item">
          <span class="ic" style="background: #EEF0EA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <b>Privacy and your data</b>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA396" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="home"></div>
</div></div></div>
</body>
</html>
