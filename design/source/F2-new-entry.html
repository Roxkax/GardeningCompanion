<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F2 New entry</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<style>
  .screen { background: #3B4139; }
  .status { color: #fff; }
  .behind { position: absolute; top: 58px; left: 16px; right: 16px; height: 40px; border-radius: 14px 14px 0 0; background: #6F756C; }
  .sheet { position: absolute; top: 66px; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #CDD2C8; align-self: center; margin-top: 8px; flex: none; }
  .nav { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .nav .cancel { font-size: 17px; color: var(--green); font-weight: 600; min-width: 64px; }
  .nav b { font-size: 17px; font-weight: 700; }
  .nav .save { font-size: 17px; color: var(--green); font-weight: 800; min-width: 64px; text-align: right; }
  .content { flex: 1; overflow: hidden; padding: 0 20px 0; display: flex; flex-direction: column; gap: 14px; }
  .content > * { flex: none; }
  .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .act { background: #fff; border: 1px solid var(--line); border-radius: 14px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 700; }
  .act.on { border: 2px solid var(--green); background: var(--green-soft); color: var(--green-ink); }
  .beds { display: flex; flex-wrap: wrap; gap: 8px; }
  .bed { height: 40px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .bed.on { background: var(--green); border-color: var(--green); color: #fff; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .rowi { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; min-height: 48px; border-bottom: 1px solid #EEF0EA; font-size: 16px; font-weight: 600; }
  .rowi:last-child { border-bottom: none; }
  .rowi span { color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #EEF0EA; border-radius: 11px; padding: 3px; width: 220px; }
  .seg i { font-style: normal; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg i.on { background: #fff; color: var(--text); font-weight: 800; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .photos { display: flex; gap: 10px; }
  .addph { width: 64px; height: 64px; border-radius: 14px; border: 1.5px dashed #9DB894; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--green); }
  .note { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 52px; font-size: 15.5px; line-height: 1.4; }
  .footer { flex: none; padding: 12px 20px 34px; background: var(--bg); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="status">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0z" fill="#fff"/><path d="M3.6 6.9a6.3 6.3 0 0 1 8.8 0l-1.4 1.6a4.2 4.2 0 0 0-6 0z" fill="#fff"/><path d="M1.2 4.2a9.7 9.7 0 0 1 13.6 0l-1.4 1.6a7.6 7.6 0 0 0-10.8 0z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#fff" opacity=".5"/></svg>
    </span>
  </div>
  <div class="behind"></div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="nav"><span class="cancel">Cancel</span><b>New entry</b><span class="save"></span></div>
    <div class="content">
      <div>
        <div class="label">What did you do?</div>
        <div class="acts">
          <div class="act on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5A2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Watered</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><circle cx="8" cy="15" r="1.3"/><circle cx="12" cy="15" r="1.3"/><circle cx="16" cy="15" r="1.3"/><path d="M12 4v6M9 7l3 3 3-3"/></svg>Sowed</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20h12"/><path d="M12 20V11"/><path d="M12 11c0-3 2-5 6-5 0 3-2 5-6 5zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>Planted</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M17 7L7 17"/><path d="M4 20l3-3"/><path d="M9 13l2 2"/></svg>Weeded</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c3-2 6-2 9 0s6 2 9 0"/><path d="M3 13c3-2 6-2 9 0s6 2 9 0"/></svg>Mulched</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.5 10h-11z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>Harvested</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4v4l3 3v10H7V10l3-3z"/><path d="M7 14h10"/></svg>Treated</div>
          <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Note</div>
        </div>
      </div>

      <div>
        <div class="label">Where? · 2 beds</div>
        <div class="beds">
          <span class="bed">A1</span>
          <span class="bed on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>A2</span>
          <span class="bed">A3</span>
          <span class="bed on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>A4</span>
          <span class="bed">All of Zone A</span>
          <span class="bed">Zone C</span>
        </div>
      </div>

      <div class="card">
        <div class="rowi">How
          <div class="seg"><i>Drip</i><i>Hose</i><i class="on">Can</i></div>
        </div>
        <div class="rowi">How long <span>30 min
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4E5A4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
        <div class="rowi">When <span>Today, 7:40
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4E5A4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
      </div>

      <div>
        <div class="label">Note and photos</div>
        <div class="note" style="margin-bottom: 10px">A4 dries faster than A2. Lettuce was a bit limp before watering.</div>
        <div class="photos">
          <div class="addph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D6A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add</div>
          <div class="addph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D6A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</div>
          <div style="width: 64px; height: 64px; border-radius: 14px; overflow: hidden">
            <svg width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" fill="#7E5F3F"/><g fill="#6FAF5A"><circle cx="16" cy="18" r="8"/><circle cx="46" cy="20" r="8"/><circle cx="20" cy="46" r="8"/><circle cx="48" cy="48" r="8"/></g><g fill="#A9D48C"><circle cx="16" cy="18" r="3.5"/><circle cx="46" cy="20" r="3.5"/><circle cx="20" cy="46" r="3.5"/><circle cx="48" cy="48" r="3.5"/></g></svg>
          </div>
        </div>
      </div>
    </div>
    <div class="footer"><div class="btn primary">Save entry</div></div>
  </div>
  <div class="home"></div>
</div></div></div>
</body>
</html>
