name: Import backlog

# Creates labels, sprint milestones and the Epic -> Feature -> Task issues
# from planning/backlog/backlog.json. Safe to re-run: existing issues are updated
# if they changed, missing ones are created, then all are added to the sprint board.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of issues to create (0 = all)"
        default: "0"
      dry_run:
        description: "List what would be created without creating anything"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: import-backlog
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: python3 planning/backlog/import_backlog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          PAUSE_SECONDS: "4"
      - name: Add new issues to the sprint board
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then python3 planning/backlog/setup_project.py; else echo "No PROJECT_TOKEN; board not updated"; fi
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.BACKLOG_ADMIN_TOKEN }}
          PAUSE_SECONDS: "1.5"
