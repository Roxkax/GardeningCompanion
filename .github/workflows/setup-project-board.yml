name: Set up sprint board

# Creates the "Gardening Companion" GitHub Project, links it to this repository,
# adds every backlog issue and fills each task's Estimate (h). Safe to re-run.
# Needs the PROJECT_TOKEN secret (or BACKLOG_ADMIN_TOKEN): a classic personal access token with the
# `project` and `repo` scopes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-backlog
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Set up the project board
        run: python3 planning/backlog/setup_project.py
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.BACKLOG_ADMIN_TOKEN }}
          PAUSE_SECONDS: "1.5"
